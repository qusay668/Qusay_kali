  <script>
    // قراءة المسار الذي حاول المستخدم الوصول إليه
    var path = window.location.pathname;

    var newPath = "/Qusay_kali/" + "index.html" + location.search + location.hash;
    
    // يتم التوجيه إلى المسار الجديد
